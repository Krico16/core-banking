global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # Métricas de negocio (fase 8) — solo donde el roadmap las pide explícitamente,
  # no en los 9 servicios (YAGNI). Las trazas de los otros servicios van vía OTLP
  # al otel-collector, no por scrape.
  - job_name: 'ledger-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ledger-service:3004']

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:3005']

  - job_name: 'risk-service'
    static_configs:
      - targets: ['risk-service:3006']

  # Redpanda expone métricas Prometheus nativas en su Admin API (incluye lag de
  # consumer groups por topic) — sin código de aplicación adicional.
  - job_name: 'redpanda'
    metrics_path: /public_metrics
    static_configs:
      - targets: ['redpanda:9644']

alerting:
  alertmanagers: []

rule_files: []
