services:
  auth-service:
    build:
      context: ../../
      dockerfile: apps/auth-service/Dockerfile
    container_name: banking-auth-service
    environment:
      PORT: 3001
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: auth_user
      DATABASE_PASSWORD: auth_pass
      DATABASE_NAME: auth_db
      DATABASE_LOGGING: "false"
      DATABASE_MIGRATIONS_RUN: "true"
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ACCESS_TOKEN_EXPIRATION: 15m
      JWT_REFRESH_TOKEN_EXPIRATION: 7d
      JWT_ISSUER: banking-auth-service
      JWT_AUDIENCE: banking-platform
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    secrets:
      - jwt_private_key
      - jwt_public_key
    networks:
      - banking_internal
      - banking_public
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

secrets:
  jwt_private_key:
    file: ./keys/private.pem
  jwt_public_key:
    file: ./keys/public.pem

networks:
  banking_internal:
    external: true
    name: banking_banking_internal
  banking_public:
    external: true
    name: banking_banking_public
